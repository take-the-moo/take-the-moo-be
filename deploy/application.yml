# 배포용 설정 (compose.coolify.yml). 값은 적지 않고 전부 환경변수로 받는다. 키를 여기에 쓰지 않는다.
# 이미지의 /app/config/application.yml로 들어가며, 값은 컨테이너가 시작할 때 환경변수에서 읽는다.
# 로컬 개발은 src/main/resources/application.yml(gitignore)을 쓴다. 항목을 추가하면 양쪽을 맞춘다.
spring:
  application:
    name: hackathon-llm
  config:
    import: classpath:prompts.yml
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # SSE 스트리밍이 기본 30초에 끊기지 않게 LLM 전체 요청 상한보다 길게 둔다
      request-timeout: 180s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}

llm:
  mock: ${LLM_MOCK:false}
  timeout:
    connect: 5s
    read: 60s
    request: 120s
  max-retries: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

logging:
  level:
    com.hackathon: INFO

app:
  station:
    api-key: ${APP_STATION_API_KEY:}
  tour:
    service-key: ${APP_TOUR_SERVICE_KEY:}
  weather:
    kma-service-key: ${APP_WEATHER_KMA_SERVICE_KEY:}
