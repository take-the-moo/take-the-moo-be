# Coolify 배포용. 로컬 개발은 compose.yml을 쓴다.
# - 포트를 공개하지 않는다. api는 Coolify의 Domains로 연결하고(https://주소:8080), mysql은 내부에서만 접속한다
# - 값은 Coolify의 Environment Variables에 넣는다. 이 파일에 키와 비밀번호를 쓰지 않는다
# - 설정은 deploy/application.yml이 이미지에 들어가고, 시작할 때 환경변수를 읽는다
services:
  api:
    build:
      context: .
      target: deploy
    expose:
      - "8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hackathon
      DB_USERNAME: hackathon
      DB_PASSWORD: ${DB_PASSWORD:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MOCK: ${LLM_MOCK:-false}
      APP_WEATHER_KMA_SERVICE_KEY: ${APP_WEATHER_KMA_SERVICE_KEY:-}
      APP_TOUR_SERVICE_KEY: ${APP_TOUR_SERVICE_KEY:-}
      APP_STATION_API_KEY: ${APP_STATION_API_KEY:-}
      TZ: Asia/Seoul
    volumes:
      # 사진·엽서 파일(app.storage.dir = 컨테이너의 /app/uploads)
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hackathon
      MYSQL_USER: hackathon
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$는 compose가 치환하지 않고 컨테이너의 환경변수로 넘긴다 (비밀번호가 명령줄에 남지 않게)
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -uhackathon"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  uploads-data:
