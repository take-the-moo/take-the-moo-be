spring:
  application:
    name: hackathon-llm
  config:
    # 프롬프트는 prompts.yml에서만 관리한다 (Java 코드에 프롬프트 문자열 금지)
    # 로컬 시크릿(API 키 등)은 gitignore된 application-secret.yml에 둔다. 없으면 무시 (예시: application-secret.yml.example)
    import:
      - classpath:prompts.yml
      - optional:classpath:application-secret.yml
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # SSE 스트리밍이 기본 30초에 끊기지 않게 LLM 전체 요청 상한보다 길게 둔다
      request-timeout: 180s
  servlet:
    multipart:
      # 이미지 5MB 제한은 컨트롤러 검증(@ImageFile)이 422로 응답한다. 여기는 그보다 큰 업로드를 막는 바깥 한도
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    # 로컬 bootRun은 `docker compose up -d mysql`로 띄운 DB에 붙는다. 기본값은 compose의 개발용 계정
    url: ${DB_URL:jdbc:mysql://localhost:3307/hackathon}
    username: ${DB_USERNAME:hackathon}
    password: ${DB_PASSWORD:hackathon}
  jpa:
    hibernate:
      # 해커톤용 — 엔티티 변경을 스키마에 바로 반영한다 (데이터 보존이 중요해지면 validate로)
      ddl-auto: update
    open-in-view: false
  ai:
    anthropic:
      # 키는 application-secret.yml(우선) 또는 환경변수로 주입한다. 값을 이 파일에 직접 쓰지 않는다 (pre-commit이 차단)
      api-key: ${ANTHROPIC_API_KEY:}

llm:
  # true면 실제 API를 호출하지 않고 고정 응답을 돌려준다 (LLM_MOCK=true 또는 --llm.mock=true)
  mock: ${LLM_MOCK:false}
  timeout:
    connect: 5s
    read: 60s
    # 한 요청(스트리밍 포함) 전체 상한
    request: 120s
  max-retries: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

logging:
  level:
    com.hackathon: INFO
