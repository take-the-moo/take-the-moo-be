plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hackathon'
version = '0.0.1-SNAPSHOT'
description = 'Seodaemun footprints API server for international students'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', '2.0.2')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	// JWT: 로그인한 사용자에게 서버가 발급하는 인증 토큰 (HS256)
	// 코드는 jjwt-api만 쓰고, 구현(impl)·JSON 처리(jackson)는 실행할 때만 필요하다
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// 비밀번호 해시(BCrypt). Spring Security 전체가 아니라 암호화 모듈만 넣는다 (로그인 화면·필터가 생기지 않는다)
	implementation 'org.springframework.security:spring-security-crypto'
	// 엽서 합성(ImageIO)에서 webp 사진을 읽는다. JDK ImageIO는 jpeg·png만 읽는다
	runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 테스트·CI는 MySQL 없이 H2 인메모리(MySQL 모드)로 돈다
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

// JDK 24+에서 Lombok이 내는 sun.misc.Unsafe 경고를 끈다 (컴파일 출력·훅 메시지를 깨끗하게)
tasks.withType(JavaCompile).configureEach {
	options.fork = true
	options.forkOptions.jvmArgs += ['--sun-misc-unsafe-memory-access=allow']
}

