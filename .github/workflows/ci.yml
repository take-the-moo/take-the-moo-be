# 빌드 확인용 최소 CI. main push / PR마다 컴파일만 확인한다.
# application.yml은 gitignore(팀원끼리 로컬 공유)라 CI에서는 앱 기동·테스트를 돌리지 않는다. 테스트는 로컬에서 ./gradlew test
# merge 차단·배포는 하지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile (main + test)
        run: ./gradlew compileJava compileTestJava
