services:
  api:
    build: .
    image: hackathon-llm
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/hackathon
      # 값 없이 이름만 쓰면 셸/.env에 있을 때만 넘긴다. 기본값을 넣으면 환경변수가 yml보다 우선해서 application.yml 값을 덮는다
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - LLM_MOCK
      - APP_WEATHER_KMA_SERVICE_KEY
      - APP_TOUR_SERVICE_KEY
      - APP_STATION_API_KEY
      # 컨테이너 기본 시간대는 UTC. 코드는 SeoulTime을 쓰지만 로그 시각도 서울로 맞춘다
      - TZ=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      # 호스트 3306은 다른 프로젝트와 겹치기 쉬워 3307로 연다 (컨테이너끼리는 mysql:3306)
      - "${DB_PORT:-3307}:3306"
    environment:
      # 로컬 개발용 계정. application.yml의 DB_* 기본값과 맞춘다
      MYSQL_DATABASE: hackathon
      MYSQL_USER: hackathon
      MYSQL_PASSWORD: hackathon
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhackathon", "-phackathon"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
